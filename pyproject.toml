[project]
name = "url-rag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "acidbase @ git+https://github.com/jurdabos/acidbase.git",
    "apache-airflow>=3.0.6",
    "beautifulsoup4>=4.14.3",
    "click>=8.3.1",
    "idna>=3.15",
    "mako>=1.3.12",
    "openai>=2.24.0",
    "pendulum>=3.2.0",
    "pinecone>=8.1.0",
    "python-dotenv>=1.2.2",
    "urllib3>=2.7.0",
]

[project.scripts]
url-rag = "url_rag.cli:main"

[build-system]
requires = ["hatchling>=1,<2"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
# Required for the `acidbase @ git+https://...` direct reference in dependencies.
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/url_rag"]

# --- Canonical a6a [tool.ruff] block (target adjusted to py313 for this repo) ---
[tool.ruff]
line-length = 120
target-version = "py313"
extend-exclude = [
    ".venv",
    "build",
    "dist",
    "__pycache__",
    ".eggs",
    "*.egg-info",
]

[tool.ruff.lint]
# Conservative starting selection that mirrors the legacy flake8 + isort
# coverage. Broaden to ["E","W","F","I","B","UP","SIM","RUF"] per repo once
# the existing code is clean (use `ruff check --fix` / `--unsafe-fixes` first).
# E,W = pycodestyle       F = pyflakes (incl. F401/F541/F821)       I = isort
select = ["E", "W", "F", "I"]
# E203 conflicts with the ruff formatter; ruff itself doesn't emit W503 (that's flake8-only).
ignore = ["E203"]

[tool.ruff.lint.per-file-ignores]
# Long string fixtures and import-only test stubs are acceptable.
"tests/**/*.py" = ["E501", "F401"]
"**/__init__.py" = ["F401"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

# Pytest config (tests live under tests/, use unit/integration/e2e subdirs).
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "plugins"]
addopts = "-ra -q"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "ruff>=0.15.15",
]
