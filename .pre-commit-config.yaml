repos:
  # fast uv-powered helpers maintained by Astral
  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.8.15
    hooks:
      - id: uv-lock           # keep uv.lock fresh
      # NOTE: uv-export is NOT used here because requirements.txt lists only
      # direct deps for the Astronomer Docker image (which resolves transitive
      # deps itself). Keep requirements.txt in sync with pyproject.toml manually.

  # gitleaks hook (native binary)
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.24.2              # a known tag; then run `pre-commit autoupdate` to bump
    hooks:
      - id: gitleaks
